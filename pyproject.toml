[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isro-bas-har"
version = "0.1.0"
description = "AI Human Activity Recognition for On-board BAS Experiments (ISRO PS 26174)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ISRO BAS HAR Research Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23.5,<2.0.0",
    "opencv-python>=4.8.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.1.0",
    "mediapipe>=0.10.9",
    "pyttsx3>=2.90",
    "PyQt6>=6.5.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1"
]

[tool.vercel]
entrypoint = "src.ui.server:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
